spring.application.name=auth-service
server.port=${AUTH_SERVER_PORT:8082}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/.well-known/jwks.json
jwt.private-key-path=classpath:private.key
jwt.public-key-path=classpath:public.key
jwt.key-id=nubian-key
spring.datasource.url=${AUTH_DB_URL:jdbc:h2:file:./data/authdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${AUTH_DB_USERNAME:sa}
spring.datasource.password=${AUTH_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.expiration-ms=${JWT_EXPIRATION_MS:600000}
jwt.public-key-location=${JWT_PUBLIC_KEY_PATH:classpath:public.key}
jwt.private-key-location=${JWT_PRIVATE_KEY_PATH:classpath:private.key}
