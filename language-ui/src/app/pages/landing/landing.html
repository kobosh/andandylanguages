<div class="landing-page">
  <section class="hero">
    <h1>Andandy Languages</h1>

    <p>
      Help preserve Nubian languages through voice recordings,
      or practice pronunciation as a learner.
    </p>

    <div class="actions">
      <a routerLink="/register" [queryParams]="{ role: 'contrib' }">
        Register as Contributor
      </a>

      <a routerLink="/register" [queryParams]="{ role: 'learner' }">
        Register as Learner
      </a>

      <a routerLink="/login">
        Already have an account? Login
      </a>
    </div>
  </section>
</div>
