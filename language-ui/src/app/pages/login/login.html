<div class="login-page">
<!--  <div class="demo-section">-->
<!--    <app-demo-record></app-demo-record>-->
<!--  </div>-->

  <div class="login-section">
    <div class="container">
      <h2>Log in</h2>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Email"
          required
        />

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Password"
          required
        />

        <button type="submit">Log in</button>
      </form>

      <p>Don't have an account? <a routerLink="/register">Register</a></p>
    </div>
  </div>
  <a routerLink="/listen">Listen to Words</a>
</div>
